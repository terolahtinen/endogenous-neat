[NEAT]
fitness_criterion     = max
# NK fitness is normalized to [0, 1]; the attainable optimum is usually below
# 1, so runs always use the full --generations budget.
fitness_threshold     = 1.0
pop_size              = 6
reset_on_extinction   = False
no_fitness_termination = True

# Reproducibility of evolution (not of the landscape): uncomment to fix NEAT's RNG.
seed = 42

# Task: Test fixture (N=8).
# Inputs: 8 normalized theta. Outputs: 8 bit outputs (activation >= 0.5 -> 1)
# followed by 8 meta outputs, so num_outputs = 8 + 8 = 16.
# Intended budget: --generations 6

[NK]
# Landscape settings. The landscape sequence is derived only from
# landscape_seed, the experiment --seed, and the run index, never from
# evolution's random numbers. Schedules are "generation:value" lists.
n              = 8
initial_k      = 0
k_schedule     = 0:0, 2:2, 4:3
perturbations  = 3:0.25
landscape_seed = 12345
# Exact optimum by enumeration when n <= this (2^n evaluations).
exact_optimum_max_n = 20

[DefaultGenome]
activation_default      = sigmoid
activation_mutate_rate  = 0.0
activation_options      = sigmoid
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5
conn_add_prob           = 0.5
conn_delete_prob        = 0.5
enabled_default         = True
enabled_mutate_rate     = 0.01
feed_forward            = True
initial_connection      = full_direct
node_add_prob           = 0.2
node_delete_prob        = 0.2
num_hidden              = 0
num_inputs              = 8
num_outputs             = 16
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30
weight_min_value        = -30
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1
single_structural_mutation     = false
structural_mutation_surer      = default
bias_init_type                 = gaussian
response_init_type             = gaussian
weight_init_type               = gaussian
enabled_rate_to_true_add       = 0.0
enabled_rate_to_false_add      = 0.0

[EndogenousGenome]
activation_default      = sigmoid
activation_mutate_rate  = 0.0
activation_options      = sigmoid
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5
conn_add_prob           = 0.5
conn_delete_prob        = 0.5
enabled_default         = True
enabled_mutate_rate     = 0.01
feed_forward            = True
initial_connection      = full_direct
node_add_prob           = 0.2
node_delete_prob        = 0.2
num_hidden              = 0
num_inputs              = 8
num_outputs             = 16
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30
weight_min_value        = -30
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1
single_structural_mutation     = false
structural_mutation_surer      = default
bias_init_type                 = gaussian
response_init_type             = gaussian
weight_init_type               = gaussian
enabled_rate_to_true_add       = 0.0
enabled_rate_to_false_add      = 0.0
theta_mutate_rate              = 0.05
theta_mutate_power             = 0.02
theta_mutate_mode              = log_normal
theta_init_spread              = 0.1
theta_distance_coefficient     = 0.0
weight_mutate_power_cap        = 1.5

[DefaultSpeciesSet]
# 8 theta inputs and 16 outputs; keep the threshold below
# pop_size/min_species_size so spawn adjustment does not abort.
compatibility_threshold = 10.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size   = 2

[EndogenousReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size   = 2
